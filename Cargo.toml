[package]
name = "lursystem"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Self-hosted whistleblower-reporting and case-handling system for Swedish employers. Built on rustio-admin."
repository = "https://github.com/abdulwahed-sweden/lursystem"

[dependencies]
rustio-admin = "0.8"
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono       = { version = "0.4", features = ["serde"] }
sqlx         = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
dotenvy      = "0.15"
env_logger   = "0.11"
log          = "0.4"
# Reporter-token generation (32 random bytes URL-safe-base64) for
# the public submission flow (Phase 2). Both crates are already in
# the framework's transitive tree; the explicit deps make the
# token-generation site reviewable.
rand   = "0.8"
base64 = "0.22"
# StatusCode values for Response::with_status on non-200 paths
# (404, 403). The framework itself depends on hyper internally
# and uses hyper::StatusCode in its handler examples; the
# explicit dep here makes the project-side use reviewable.
hyper  = "1"
# Compliance-export serialisation + HMAC-SHA256 signing
# (Phase 6). All four crates are already in the transitive tree
# via rustio-admin's R3 MFA stack; declaring them as direct
# deps makes the signing site at `handlers/export.rs`
# reviewable without chasing transitive resolution.
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
hmac        = "0.12"
sha2        = "0.10"
